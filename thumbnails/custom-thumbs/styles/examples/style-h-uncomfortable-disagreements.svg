<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Montserrat, system-ui, sans-serif">
  <defs>
    <radialGradient id="hBg" cx="0.35" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#243f51"/>
      <stop offset="0.5" stop-color="#1A3040"/>
      <stop offset="1" stop-color="#0e1f2c"/>
    </radialGradient>
    <linearGradient id="hUnderline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0088b8"/>
      <stop offset="1" stop-color="#0088b8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark navy backdrop with subtle radial light -->
  <rect width="1280" height="720" fill="url(#hBg)"/>

  <!-- Pastor silhouette placeholder (right-anchored) — production swaps with real cutout -->
  <g opacity="0.18" fill="#6b8a9f">
    <!-- Stylized head + shoulders -->
    <circle cx="930" cy="280" r="100"/>
    <path d="M780 720 L780 540 Q780 440 930 440 Q1080 440 1080 540 L1080 720 Z"/>
  </g>
  <!-- Production direction overlay -->
  <g transform="translate(840,620)">
    <rect x="0" y="0" width="240" height="60" rx="2" fill="#1A3040" fill-opacity="0.92" stroke="#0088b8" stroke-width="1.5"/>
    <text x="14" y="22" fill="#7fc7df" font-size="9" font-weight="700" letter-spacing="2.5">PASTOR CUTOUT</text>
    <text x="14" y="40" fill="#cfe1ea" font-size="10" font-weight="500" letter-spacing="0.5">Production: PNG with</text>
    <text x="14" y="52" fill="#cfe1ea" font-size="10" font-weight="500" letter-spacing="0.5">transparent background</text>
  </g>

  <!-- Top-right circular brand badge (matches Joel's "Joel" badge approach) -->
  <g transform="translate(1180,82)">
    <circle cx="0" cy="0" r="42" fill="#ffffff"/>
    <text x="0" y="6" fill="#0088b8" font-size="14" font-weight="800" letter-spacing="0.5" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic">Stacy</text>
  </g>

  <!-- Series eyebrow -->
  <line x1="80" y1="120" x2="140" y2="120" stroke="#7fc7df" stroke-width="2"/>
  <text x="160" y="128" fill="#7fc7df" font-size="14" font-weight="700" letter-spacing="5">UNCOMFORTABLE</text>

  <!-- Title — bold uppercase italic-condensed, 1-2 lines -->
  <text x="80" y="320" fill="#ffffff" font-size="120" font-weight="900" font-style="italic" letter-spacing="-3" font-stretch="condensed">Disagreements</text>

  <!-- Underline accent (gradient teal, fades out) -->
  <rect x="80" y="500" width="260" height="6" fill="url(#hUnderline)"/>

  <!-- Pastor name below title -->
  <text x="80" y="550" fill="#cfe1ea" font-size="20" font-weight="700" letter-spacing="4">PASTOR DR. STACY NOWELL</text>
</svg>
