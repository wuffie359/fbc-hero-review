<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Montserrat, system-ui, sans-serif">
  <defs>
    <linearGradient id="bBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F1EE"/>
      <stop offset="1" stop-color="#EBDFD9"/>
    </linearGradient>
    <linearGradient id="bAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0088b8"/>
      <stop offset="1" stop-color="#006a8e"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bBg)"/>

  <!-- Teal wedge cutting in from the right (design statement, no fake logo overlay) -->
  <polygon points="980,0 1280,0 1280,720 1140,720" fill="url(#bAccent)" opacity="0.95"/>
  <polygon points="1140,720 1280,720 1280,560" fill="#1A3040" opacity="0.92"/>

  <!-- Series pill — top-left -->
  <g transform="translate(80,82)">
    <rect x="0" y="0" width="280" height="42" rx="3" fill="#0088b8"/>
    <text x="20" y="29" fill="#ffffff" font-size="14" font-weight="800" letter-spacing="3.5">UNCOMFORTABLE</text>
    <line x1="200" y1="10" x2="200" y2="32" stroke="#cfe1ea" stroke-width="1" opacity="0.55"/>
    <text x="220" y="29" fill="#cfe1ea" font-size="12" font-weight="700" letter-spacing="2">PT 03</text>
  </g>

  <!-- Title: 1 or 2 lines, dynamic Y position (set by renderer) -->
  <text x="80" y="380" fill="#1A3040" font-size="108" font-weight="900" letter-spacing="-3.5">Disagreements</text>

  <!-- Footer: rule + date (line 1) + pastor (line 2) — separate lines, never overflow -->
  <line x1="80" y1="600" x2="240" y2="600" stroke="#0088b8" stroke-width="3"/>
  <text x="80" y="640" fill="#1A3040" font-size="16" font-weight="700" letter-spacing="3.5">MAY 10 · 2026</text>
  <text x="80" y="668" fill="#4a5d6c" font-size="13" font-weight="600" letter-spacing="3">DR. STACY NOWELL</text>
</svg>
