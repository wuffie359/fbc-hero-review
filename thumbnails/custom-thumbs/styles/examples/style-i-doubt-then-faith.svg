<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Montserrat, system-ui, sans-serif">
  <defs>
    <radialGradient id="iStage" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#1f3a4a"/>
      <stop offset="0.6" stop-color="#16303f"/>
      <stop offset="1" stop-color="#06141d"/>
    </radialGradient>
    <linearGradient id="iWashLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0088b8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0088b8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark stage backdrop -->
  <rect width="1280" height="720" fill="url(#iStage)"/>
  <rect width="640" height="720" fill="url(#iWashLeft)"/>

  <!-- Pastor silhouette placeholder anchored right -->
  <g opacity="0.16" fill="#6b8a9f">
    <circle cx="980" cy="300" r="95"/>
    <path d="M840 720 L840 540 Q840 440 980 440 Q1120 440 1120 540 L1120 720 Z"/>
  </g>
  <g transform="translate(890,640)">
    <rect x="0" y="0" width="200" height="56" rx="2" fill="#1A3040" fill-opacity="0.92" stroke="#7fc7df" stroke-width="1"/>
    <text x="12" y="20" fill="#7fc7df" font-size="9" font-weight="700" letter-spacing="2.5">PASTOR CUTOUT</text>
    <text x="12" y="36" fill="#cfe1ea" font-size="9.5" font-weight="500">Anchor right, ¾ angle,</text>
    <text x="12" y="48" fill="#cfe1ea" font-size="9.5" font-weight="500">stage lighting backdrop</text>
  </g>

  <!-- The signature element: thin elliptical line frame -->
  <ellipse cx="500" cy="360" rx="440" ry="280" fill="none" stroke="#7fc7df" stroke-width="1.2" stroke-opacity="0.55"/>
  <ellipse cx="500" cy="360" rx="442" ry="282" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Inside frame: hierarchy -->
  <text x="500" y="180" fill="#7fc7df" font-size="13" font-weight="700" letter-spacing="6" text-anchor="middle">SERMON</text>

  <text x="500" y="280" fill="#cfe1ea" font-size="14" font-weight="700" letter-spacing="5" text-anchor="middle"></text>

  <text x="500" y="380" fill="#e8f0f4" font-size="68" font-weight="600" letter-spacing="2" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif">A SUNDAY MESSAGE</text>

  <text x="500" y="440" fill="#cfe1ea" font-size="36" font-weight="600" letter-spacing="0.5" text-anchor="middle">Doubt, Then Faith</text>

  <!-- Tiny FBC mark bottom-left (matches Village Church's tiny "v" mark) -->
  <g transform="translate(60,660)">
    <rect x="-22" y="-22" width="44" height="44" fill="#0088b8"/>
    <text x="0" y="6" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="-1" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic">f</text>
  </g>
</svg>
