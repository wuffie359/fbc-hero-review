<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif">
  <defs>
    <linearGradient id="cSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1e2a"/>
      <stop offset="0.3" stop-color="#1A3040"/>
      <stop offset="0.55" stop-color="#3a5d6e"/>
      <stop offset="0.7" stop-color="#9c6f3e" stop-opacity="0.85"/>
      <stop offset="0.85" stop-color="#cf8a3e" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#1c1208"/>
    </linearGradient>
    <radialGradient id="cSun" cx="0.62" cy="0.66" r="0.35">
      <stop offset="0" stop-color="#f5cc8a" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#cf8a3e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#cf8a3e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cVignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <!-- New: dedicated contrast scrim behind the title -->
    <linearGradient id="cScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="1280" height="720" fill="url(#cSky)"/>
  <rect width="1280" height="720" fill="url(#cSun)"/>
  <rect width="1280" height="720" fill="url(#cVignette)"/>

  <!-- Title contrast scrim -->
  <rect x="0" y="160" width="1280" height="280" fill="url(#cScrim)" opacity="0.7"/>

  <!-- Subtle horizon line — abstract instead of crude silhouettes -->
  <line x1="0" y1="476" x2="1280" y2="476" stroke="#f5cc8a" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Eyebrow LABEL -->
  <text x="640" y="128" fill="#f5cc8a" font-size="14" font-weight="700" letter-spacing="6" text-anchor="middle" font-family="Montserrat, system-ui, sans-serif">A SUNDAY MESSAGE</text>
  <!-- Title — italic serif, centered, dynamic size, anchored higher in dark zone -->
  <text x="640" y="290" fill="#ffffff" font-size="96" font-style="italic" font-weight="500" letter-spacing="0.5" text-anchor="middle">Doubt, Then Faith</text>

  <!-- Footer — date and pastor on separate readable lines -->
  <text x="640" y="650" fill="#e6f4f9" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle" font-family="Montserrat, system-ui, sans-serif">APRIL 12 · 2026</text>
  <text x="640" y="685" fill="#a4c0cf" font-size="13" font-weight="600" letter-spacing="3" text-anchor="middle" font-family="Montserrat, system-ui, sans-serif">DR. STACY NOWELL</text>
</svg>
