<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Montserrat, system-ui, sans-serif">
  <defs>
    <linearGradient id="jLeftBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A3040"/>
      <stop offset="1" stop-color="#0e1f2c"/>
    </linearGradient>
    <linearGradient id="jObjectPlaceholder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a5d6e"/>
      <stop offset="0.5" stop-color="#5d7e8f"/>
      <stop offset="1" stop-color="#2c4658"/>
    </linearGradient>
  </defs>

  <!-- Left navy block (45% width) -->
  <rect x="0" y="0" width="576" height="720" fill="url(#jLeftBlock)"/>

  <!-- Right object placeholder (55% width) -->
  <rect x="576" y="0" width="704" height="720" fill="url(#jObjectPlaceholder)"/>

  <!-- Object placeholder: stylized open Bible (page rectangles + spine line) -->
  <g transform="translate(928,360)" opacity="0.4">
    <!-- Left page -->
    <path d="M-220 -120 L-220 120 Q-220 130 -210 130 L-15 120 L-15 -110 Q-15 -120 -25 -120 Z" fill="#e8e0d5" stroke="#a4c0cf" stroke-width="1.5"/>
    <!-- Right page -->
    <path d="M220 -120 L220 120 Q220 130 210 130 L15 120 L15 -110 Q15 -120 25 -120 Z" fill="#e8e0d5" stroke="#a4c0cf" stroke-width="1.5"/>
    <!-- Page lines -->
    <g stroke="#5d7e8f" stroke-width="1" opacity="0.5">
      <line x1="-200" y1="-70" x2="-40" y2="-65"/>
      <line x1="-200" y1="-45" x2="-40" y2="-40"/>
      <line x1="-200" y1="-20" x2="-40" y2="-15"/>
      <line x1="-200" y1="5" x2="-40" y2="10"/>
      <line x1="-200" y1="30" x2="-40" y2="35"/>
      <line x1="-200" y1="55" x2="-40" y2="60"/>
      <line x1="40" y1="-65" x2="200" y2="-70"/>
      <line x1="40" y1="-40" x2="200" y2="-45"/>
      <line x1="40" y1="-15" x2="200" y2="-20"/>
      <line x1="40" y1="10" x2="200" y2="5"/>
      <line x1="40" y1="35" x2="200" y2="30"/>
      <line x1="40" y1="60" x2="200" y2="55"/>
    </g>
  </g>

  <!-- Production note for the object photo -->
  <g transform="translate(900,620)">
    <rect x="0" y="0" width="320" height="64" rx="2" fill="#1A3040" fill-opacity="0.92" stroke="#0088b8" stroke-width="1.5"/>
    <text x="14" y="22" fill="#7fc7df" font-size="9" font-weight="700" letter-spacing="2.5">OBJECT PHOTO</text>
    <text x="14" y="40" fill="#cfe1ea" font-size="10" font-weight="500">Series-specific object: open Bible,</text>
    <text x="14" y="54" fill="#cfe1ea" font-size="10" font-weight="500">communion, candle, cross, etc.</text>
  </g>

  <!-- Top of left block: SERMON / series stack -->
  <text x="60" y="120" fill="#7fc7df" font-size="14" font-weight="700" letter-spacing="6">SERMON SERIES</text>

  <!-- Series name — huge serif uppercase -->
  <text x="60" y="240" fill="#ffffff" font-size="84" font-weight="700" letter-spacing="-1" font-family="'Cormorant Garamond', Georgia, serif">UNCOMFORTABLE</text>

  <!-- Week marker -->
  <line x1="60" y1="290" x2="160" y2="290" stroke="#0088b8" stroke-width="3"/>
  <text x="60" y="330" fill="#cfe1ea" font-size="16" font-weight="700" letter-spacing="4">WEEK 03</text>

  <!-- Sermon title -->
  <text x="60" y="430" fill="#e8f0f4" font-size="56" font-weight="700" letter-spacing="-1.2">Disagreements</text>

  <!-- FBC brand line bottom-left -->
  <line x1="60" y1="630" x2="160" y2="630" stroke="#0088b8" stroke-width="2"/>
  <text x="60" y="668" fill="#a4c0cf" font-size="11" font-weight="700" letter-spacing="3.5">FIRST BAPTIST CHURCH HUNTERSVILLE</text>
</svg>
