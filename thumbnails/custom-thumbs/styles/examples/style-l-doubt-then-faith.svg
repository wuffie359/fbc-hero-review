<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Montserrat, system-ui, sans-serif">
  <defs>
    <filter id="lTexture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="9"/>
      <feColorMatrix values="0 0 0 0 0.9
                             0 0 0 0 0.95
                             0 0 0 0 1
                             0 0 0 0.05 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="lTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0088b8"/>
      <stop offset="1" stop-color="#006a8e"/>
    </linearGradient>
  </defs>

  <!-- Left block: dark navy textured -->
  <rect x="0" y="0" width="850" height="720" fill="#1A3040"/>
  <rect x="0" y="0" width="850" height="720" filter="url(#lTexture)" opacity="0.5"/>

  <!-- Right block: bright teal -->
  <rect x="850" y="0" width="430" height="720" fill="url(#lTeal)"/>

  <!-- Top eyebrow bar -->
  <line x1="40" y1="65" x2="800" y2="65" stroke="#cfe1ea" stroke-width="1" opacity="0.4"/>
  <text x="60" y="98" fill="#7fc7df" font-size="14" font-weight="700" letter-spacing="3" font-family="Montserrat, sans-serif">
    <tspan>THE </tspan><tspan fill="#ffffff">FBC HUNTERSVILLE SUNDAY MESSAGE</tspan>
  </text>
  <line x1="40" y1="118" x2="800" y2="118" stroke="#cfe1ea" stroke-width="1" opacity="0.4"/>

  <!-- Pastor circle portrait on the right -->
  <g transform="translate(1065,330)">
    <circle cx="0" cy="0" r="160" fill="#cfe1ea" opacity="0.95"/>
    <!-- Silhouette inside circle -->
    <clipPath id="lCirclePath"><circle cx="0" cy="0" r="160"/></clipPath>
    <g clip-path="url(#lCirclePath)" opacity="0.55" fill="#5a7a90">
      <circle cx="0" cy="-30" r="62"/>
      <path d="M-130 200 L-130 100 Q-130 50 0 50 Q130 50 130 100 L130 200 Z"/>
    </g>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#1A3040" stroke-width="6"/>
  </g>
  <!-- Production note -->
  <g transform="translate(880,540)">
    <rect x="0" y="0" width="200" height="56" rx="2" fill="#1A3040" fill-opacity="0.92"/>
    <text x="12" y="20" fill="#7fc7df" font-size="9" font-weight="700" letter-spacing="2.5">PASTOR HEADSHOT</text>
    <text x="12" y="36" fill="#cfe1ea" font-size="9.5" font-weight="500">Production: square crop</text>
    <text x="12" y="48" fill="#cfe1ea" font-size="9.5" font-weight="500">portrait, neutral bg</text>
  </g>

  <!-- Title — 3-line uppercase white sans on left -->
  <text x="60" y="260" fill="#ffffff" font-size="58" font-weight="800" letter-spacing="-0.5">DOUBT</text>
  <text x="60" y="328" fill="#ffffff" font-size="58" font-weight="800" letter-spacing="-0.5">THEN FAITH</text>
  <text x="60" y="396" fill="#ffffff" font-size="58" font-weight="800" letter-spacing="-0.5"></text>

  <!-- Series pill — solid teal block -->
  <g transform="translate(60,460)">
    <rect x="0" y="0" width="340" height="56" rx="2" fill="#0088b8"/>
    <text x="20" y="36" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="3.5">APRIL 12 · 2026</text>
  </g>

  <!-- Audio waveform graphic bottom-left (signals podcast/audio content) -->
  <g transform="translate(60,640)">
    <g fill="#7fc7df" opacity="0.7">
      <rect x="0" y="-6" width="3" height="12"/>
      <rect x="8" y="-12" width="3" height="24"/>
      <rect x="16" y="-18" width="3" height="36"/>
      <rect x="24" y="-10" width="3" height="20"/>
      <rect x="32" y="-22" width="3" height="44"/>
      <rect x="40" y="-15" width="3" height="30"/>
      <rect x="48" y="-25" width="3" height="50"/>
      <rect x="56" y="-18" width="3" height="36"/>
      <rect x="64" y="-12" width="3" height="24"/>
      <rect x="72" y="-20" width="3" height="40"/>
      <rect x="80" y="-8" width="3" height="16"/>
      <rect x="88" y="-14" width="3" height="28"/>
      <rect x="96" y="-22" width="3" height="44"/>
      <rect x="104" y="-15" width="3" height="30"/>
      <rect x="112" y="-10" width="3" height="20"/>
      <rect x="120" y="-18" width="3" height="36"/>
      <rect x="128" y="-12" width="3" height="24"/>
      <rect x="136" y="-7" width="3" height="14"/>
      <rect x="144" y="-20" width="3" height="40"/>
      <rect x="152" y="-13" width="3" height="26"/>
      <rect x="160" y="-9" width="3" height="18"/>
      <rect x="168" y="-15" width="3" height="30"/>
      <rect x="176" y="-22" width="3" height="44"/>
      <rect x="184" y="-11" width="3" height="22"/>
      <rect x="192" y="-6" width="3" height="12"/>
    </g>
  </g>
</svg>
